name: Update ADM Lottery Catalog

on:
  schedule:
    # Esegue ogni lunedì alle 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ADM & GrattaeVinci Scraper
        run: python scraper_catalogo.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js catalogo_completo.json
          if git diff --staged --quiet; then
            echo "Nessuna variazione nel catalogo ADM."
          else
            git commit -m "chore(data): aggiornamento automatico catalogo ADM"
            git push
          fi
